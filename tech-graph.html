---
layout: null
title: 技术图谱
description: 在一张可以拖动的星图里，查看语言、工具和开源项目之间的联系。
permalink: /tech-graph/
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101f22">{% seo %}
  <link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/tech-graph.css' | relative_url }}">
  <script defer src="{{ '/assets/js/tech-graph.js' | relative_url }}"></script>
</head>
<body>
<header class="atlas-head">
  <a class="back" href="{{ '/projects/' | relative_url }}">← 项目实验室</a>
  <h1>技术星图<span lang="en"> / TECH ATLAS</span></h1>
  <label><span>定位节点</span><select id="atlas-node"><option value="">全部节点</option></select></label>
</header>
<canvas id="graph" aria-label="技术星图。也可以使用顶部定位菜单选择节点、查看关联技术与仓库。"></canvas>
<details class="inspector" id="atlas-panel" open>
  <summary>节点索引</summary>
  <div class="readout" aria-live="polite"><p id="atlas-type"></p><h2 id="atlas-title">技术图谱</h2></div>
  <section id="atlas-related" hidden><h3>相邻节点</h3><div id="atlas-connections"></div></section>
  <section id="atlas-project-section"><h3>关联仓库</h3><div id="atlas-projects"></div></section>
</details>
<div class="atlas-footer"><div id="atlas-legend" aria-label="节点类型"></div>
<div class="zoom"><button type="button" id="atlas-out" aria-label="缩小">−</button><button type="button" id="atlas-reset">复位</button><button type="button" id="atlas-in" aria-label="放大">＋</button></div></div>
<noscript><p class="no-js">动态图谱需要 JavaScript。<a href="{{ '/projects/' | relative_url }}">浏览全部项目</a>。</p></noscript>
</body></html>
