<li class="post-row"><a href="{{ include.post.url | relative_url }}"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%Y.%m.%d" }}</time><strong>{{ include.post.title | escape }}</strong><span class="row-topic">{{ include.post.categories | first }}</span><span aria-hidden="true">↗</span></a></li>
