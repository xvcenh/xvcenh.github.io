title: "xvcenh的博客"
email: xvcenh@gmail.com
description: "xvcenh(徐辰)的技术博客 - 记录软件开发、运维部署、数据库管理与工具使用中的问题与解决方案"
baseurl: ""
url: "https://xvcenh.github.io"
author: "xvcenh"
lang: zh-CN
timezone: Asia/Shanghai

# SEO标签插件配置
twitter:
  username: xvcenh
  card: summary_large_image
social:
  name: xvcenh
  links:
    - https://github.com/xvcenh
    - https://xvcenh.github.io

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag

# 排除源码工程（devour-tide 只发布构建产物）
exclude:
  - devour-tide/source

# 分页设置
paginate: 12
paginate_path: "/page:num/"

# 自定义变量
project_name: "xvcenh的博客"
