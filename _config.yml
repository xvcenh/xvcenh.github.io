title: "xvcenh · 工程手记"
description: "徐辰的个人技术博客。记录软件开发、硬件调试和运维部署中的问题，也收藏可以亲手玩的开源实验。"
author: xvcenh
email: xvcenh@gmail.com
url: https://xvcenh.github.io
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      render_with_liquid: false
exclude:
  - README.md
  - GITHUB_PAGES_SETUP.md
  - Gemfile
  - Gemfile.lock
  - "*.zip"
  - "*.sh"
  - scripts/
  - vendor/
  - devour-tide/README.md
  - super-blog/README.md
  - super-blog/screenshots/
  - output/
  - node_modules/
